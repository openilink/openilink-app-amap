services:
  amap-app:
    build: .
    container_name: openilink-app-amap
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8090}"
      HUB_URL: "${HUB_URL}"
      BASE_URL: "${BASE_URL}"
      DB_PATH: "/data/amap.db"
      AMAP_KEY: "${AMAP_KEY:-}"
      CONFIG_ENCRYPT_KEY: "${CONFIG_ENCRYPT_KEY}"
    volumes:
      - amap-data:/data

volumes:
  amap-data:
